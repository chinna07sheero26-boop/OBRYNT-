<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- GitHub Pages Subpath Normalizer: ensures relative paths resolve inside repository -->
    <script>
      (function () {
        try {
          var p = window.location.pathname;
          var host = window.location.hostname;
          if (host.indexOf('github.io') !== -1) {
            var parts = p.split('/').filter(Boolean);
            if (parts.length === 1 && !p.endsWith('/')) {
              window.location.replace(window.location.origin + p + '/' + window.location.search + window.location.hash);
            }
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Primary SEO Meta Tags for Google Search -->
    <title>OBRYNT — Wear Your Identity</title>
    <meta name="title" content="OBRYNT — Wear Your Identity" />
    <meta name="description" content="OBRYNT — clothing, footwear, accessories, beauty and custom-designed fashion. Wear your identity with premium apparel, footwear, beauty essentials, and bespoke custom studio." />

    <meta name="author" content="OBRYNT Studio Co." />
